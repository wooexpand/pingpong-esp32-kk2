[env:freenove_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; The native USB-Serial/JTAG peripheral accepts the ROM loader. Switching the stub
; baud rate fails once the application already owns that peripheral.
upload_speed = 115200
upload_flags =
  --no-stub
; The board sets ARDUINO_USB_MODE=1 (HWCDC). Route Serial to the native USB port
; enumerated on this computer; otherwise the log stays on UART0.
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
board_build.filesystem = littlefs
; Check the Freenove board flash size and partition table before uploadfs.
board_build.partitions = default.csv
lib_deps = links2004/WebSockets@2.4.1
