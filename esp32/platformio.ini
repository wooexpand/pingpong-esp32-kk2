[env:freenove_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Inbyggd USB-Serial/JTAG tar emot ROM-laddaren. Stubbens baudbyte misslyckas
; när appen redan använder samma periferi.
; (原生 USB-Serial/JTAG 接受 ROM 加载器。应用程序占用同一外设后，stub 的波特率切换会失败。)
upload_speed = 115200
upload_flags =
  --no-stub
; Kortet sätter ARDUINO_USB_MODE=1 (HWCDC). Led Serial till den inbyggda USB-porten
; som syns på den här datorn; annars ligger loggen kvar på UART0.
; (板级配置把 ARDUINO_USB_MODE 设为 1（HWCDC）。把 Serial 接到本机枚举出来的原生 USB 口，否则日志仍在 UART0。)
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
board_build.filesystem = littlefs
; Kontrollera Freenove-kortets flashstorlek och partitionsschema före uploadfs.
; (烧录文件系统前请核对 Freenove 板的 Flash 容量和分区表。)
board_build.partitions = default.csv
lib_deps = links2004/WebSockets@2.4.1
